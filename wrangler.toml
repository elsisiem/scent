name = "scent"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/v1/*", "/d/*", "/mcp", "/llms.txt", "/agents.md", "/openapi.json", "/.well-known/*", "/healthz"]

[[d1_databases]]
binding = "DB"
database_name = "scent"
database_id = "e40da800-58cd-4480-8b3f-aa9f3e548d18"

[triggers]
crons = ["*/30 * * * *"]

[vars]
PUBLIC_BASE_URL = "https://scent.elsisi.workers.dev"
